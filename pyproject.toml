[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comptes-bancaires"
version = "0.5.0"
description = "Relevés de comptes (CSV BoursoBank) vers Excel, analyse par contexte et graphiques Plotly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
comptes = "comptes_bancaires.releve:main"
comptes-graphiques = "comptes_bancaires.graphiques:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comptes_bancaires = ["config_defaut.json", "reference_config_v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
